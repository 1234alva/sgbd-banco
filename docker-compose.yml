services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: banco_digital
    ports:
      - "5433:5432"   
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql/init.sql:/docker-entrypoint-initdb.d/init.sql
  backend:
    build: ./backend/backend-app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db        
      DB_PORT: 5432      
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: banco_digital
    depends_on:
      - db

  frontend:
    build: ./frontend/frontend-app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - backend

volumes:
  pgdata:
